name: Bug Report
description: Report a bug in MCP Proxmox Admin
title: '[BUG] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of mcp-proxmox-admin are you using?
      placeholder: e.g., 1.0.0
    validations:
      required: true
  
  - type: input
    id: node_version
    attributes:
      label: Node.js Version
      description: What version of Node.js are you using?
      placeholder: e.g., 20.10.0
    validations:
      required: true
  
  - type: input
    id: proxmox_version
    attributes:
      label: Proxmox VE Version
      description: What version of Proxmox VE are you managing?
      placeholder: e.g., 8.1.0
    validations:
      required: false
  
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the bug
      placeholder: A clear description of what went wrong
    validations:
      required: true
  
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe what you expected
      placeholder: A clear description of what you expected to happen
    validations:
      required: true
  
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Configure '...'
        2. Run command '...'
        3. See error
    validations:
      required: true
  
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Please copy and paste any relevant log output
      render: shell
    validations:
      required: false
